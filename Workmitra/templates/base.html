<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Workmitra - Connect with Skilled Artisans{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/">🔧 Workmitra</a>
            </div>
            <div class="navbar-menu">
                {% if session.get('user_id') %}
                    <span class="navbar-text">Welcome, {{ session.get('user_name') }}!</span>
                    <a href="{{ url_for('logout') }}" class="navbar-link">Logout</a>
                {% else %}
                    <a href="{{ url_for('login_page') }}" class="navbar-link">Login</a>
                    <a href="{{ url_for('signup_page') }}" class="navbar-link">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Workmitra. Connecting skilled artisans with customers.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
